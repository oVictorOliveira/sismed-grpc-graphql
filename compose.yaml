services:
  sismed-patient-db:
    image: mysql:8.0
    volumes:
      - sismed-patient-db:/var/lib/mysql
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${PATIENT_DB_NAME}
      MYSQL_USER: ${PATIENT_DB_USER}
      MYSQL_PASSWORD: ${PATIENT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PATIENT_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exit | MYSQL_PWD=$$MYSQL_PASSWORD mysql -h sismed-patient-db -P 3306 -u $$MYSQL_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10
  sismed-patient-service:
    image: sismed-patient-service:latest
    build: ./sismed-patient-service
    restart: always
    #entrypoint: [ "java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005", "-jar", "/sismed-patient-service.jar" ]
    ports:
      - '6565:6565'
      #- '5005:5005'
    depends_on:
      sismed-patient-db:
        condition: service_healthy
    environment:
      PATIENT_DB_URL: ${PATIENT_DB_URL}
      PATIENT_DB_USER: ${PATIENT_DB_USER}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD}
  sismed-scheduling-broker:
    image: apache/kafka:latest
    volumes:
      - sismed-scheduling-broker:/var/lib/kafka/data
      - sismed-scheduling-broker:/etc/kafka/secrets
      - sismed-scheduling-broker:/mnt/shared/config
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://sismed-scheduling-broker:9092,CONTROLLER://sismed-scheduling-broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://sismed-scheduling-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@sismed-scheduling-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server sismed-scheduling-broker:9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  init-sismed-scheduling-broker:
    image: apache/kafka:latest
    volumes:
      - sismed-scheduling-broker:/var/lib/kafka/data
      - sismed-scheduling-broker:/etc/kafka/secrets
      - sismed-scheduling-broker:/mnt/shared/config
    depends_on:
      sismed-scheduling-broker:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "echo -e 'Creating sismed-scheduling-broker topic if not exists'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server sismed-scheduling-broker:9092 --create --if-not-exists --topic scheduling-notification --replication-factor 1 --partitions 3
      
      echo -e 'Topics:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server sismed-scheduling-broker:9092 --list"
  sismed-notification-service:
    image: sismed-notification-service:latest
    build: ./sismed-notification-service
    restart: always
    #entrypoint: [ "java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005", "-jar", "/sismed-notification-service.jar" ]
    ports:
      - '9088:9088'
      #- '5005:5005'
    depends_on:
      sismed-scheduling-broker:
        condition: service_healthy
  sismed-scheduling-db:
    image: mysql:8.0
    volumes:
      - sismed-scheduling-db:/var/lib/mysql
    restart: always
    ports:
      - '3308:3306'
    environment:
      MYSQL_DATABASE: ${SCHEDULING_DB_NAME}
      MYSQL_USER: ${SCHEDULING_DB_USER}
      MYSQL_PASSWORD: ${SCHEDULING_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SCHEDULING_DB_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "exit | MYSQL_PWD=$$MYSQL_PASSWORD mysql -h sismed-scheduling-db -P 3306 -u $$MYSQL_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10
  sismed-scheduling-service:
    image: sismed-scheduling-service:latest
    build: ./sismed-scheduling-service
    restart: always
    #entrypoint: [ "java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005", "-jar", "/sismed-scheduling-service.jar" ]
    ports:
      - '7575:7575'
      #- '5005:5005'
    depends_on:
      sismed-scheduling-db:
        condition: service_healthy
      sismed-scheduling-broker:
        condition: service_healthy
    environment:
      SCHEDULING_DB_URL: ${SCHEDULING_DB_URL}
      SCHEDULING_DB_USER: ${SCHEDULING_DB_USER}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD}
  sismed-aggregator-db:
    image: mysql:8.0
    volumes:
      - sismed-aggregator-db:/var/lib/mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: ${AGGREGATOR_DB_NAME}
      MYSQL_USER: ${AGGREGATOR_DB_USER}
      MYSQL_PASSWORD: ${AGGREGATOR_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${AGGREGATOR_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exit | MYSQL_PWD=$$MYSQL_PASSWORD mysql -h sismed-aggregator-db -P 3306 -u $$MYSQL_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10
  sismed-aggregator-service:
    image: sismed-aggregator-service:latest
    build: ./sismed-aggregator-service
    restart: always
    #entrypoint: [ "java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5006", "-jar", "/sismed-aggregator-service.jar" ]
    ports:
      - '8080:8080'
      #- '5006:5006'
    depends_on:
      sismed-aggregator-db:
        condition: service_healthy
      sismed-patient-service:
        condition: service_started
      sismed-scheduling-service:
        condition: service_started
    environment:
      AGGREGATOR_DB_URL: ${AGGREGATOR_DB_URL}
      AGGREGATOR_DB_USER: ${AGGREGATOR_DB_USER}
      AGGREGATOR_DB_PASSWORD: ${AGGREGATOR_DB_PASSWORD}

volumes:
  sismed-patient-db: {
    name: sismed-patient-db
  }
  sismed-aggregator-db: {
    name: sismed-aggregator-db
  }
  sismed-scheduling-db: {
    name: sismed-scheduling-db
  }
  sismed-scheduling-broker: {
    name: sismed-scheduling-broker
  }