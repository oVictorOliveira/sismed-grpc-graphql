syntax = "proto3";

package scheduling;

option java_multiple_files = true;
option java_package = "dev.sismed.scheduling";

enum ConsultaStatusProto {
  UNKNOWN = 0;
  AGENDADA = 1;
  CONFIRMADA = 2;
  REALIZADA = 3;
  CANCELADA = 4;
}

message ConsultaProto {
  int64 id = 1;
  int64 paciente_id = 2;
  int64 medico_id = 3;
  string data_hora = 4;
  string especialidade = 5;
  string observacoes = 6;
  ConsultaStatusProto status = 7;
  string criado_por = 8;
}

message CreateConsultaRequest {
  int64 paciente_id = 1;
  int64 medico_id = 2;
  string data_hora = 3;
  string especialidade = 4;
  string observacoes = 5;
  string criado_por = 6;
}

message CreateConsultaResponse {
  int64 id = 1;
  string message = 2;
}

message GetConsultaRequest {
  int64 id = 1;
}

message GetConsultaResponse {
  ConsultaProto consulta = 1;
}

message UpdateConsultaRequest {
  int64 id = 1;
  string data_hora = 2;
  string especialidade = 3;
  string observacoes = 4;
}

message UpdateConsultaResponse {
  string message = 1;
}

message CancelConsultaRequest {
  int64 id = 1;
}

message CancelConsultaResponse {
  string message = 1;
}

message ConfirmarConsultaRequest {
  int64 id = 1;
}

message ConfirmarConsultaResponse {
  string message = 1;
}

message RealizarConsultaRequest {
  int64 id = 1;
}

message RealizarConsultaResponse {
  string message = 1;
}

message ListConsultasByPacienteRequest {
  int64 paciente_id = 1;
  bool apenas_futuras = 2;
}

message ListConsultasByPacienteResponse {
  repeated ConsultaProto consultas = 1;
}

message ListUpcomingConsultasRequest {
  int32 dentro_de_horas = 1;
}

message ListUpcomingConsultasResponse {
  repeated ConsultaProto consultas = 1;
}

service SchedulingService {
  rpc CreateConsulta(CreateConsultaRequest) returns (CreateConsultaResponse);
  rpc GetConsulta(GetConsultaRequest) returns (GetConsultaResponse);
  rpc UpdateConsulta(UpdateConsultaRequest) returns (UpdateConsultaResponse);
  rpc CancelConsulta(CancelConsultaRequest) returns (CancelConsultaResponse);
  rpc ConfirmarConsulta(ConfirmarConsultaRequest) returns (ConfirmarConsultaResponse);
  rpc RealizarConsulta(RealizarConsultaRequest) returns (RealizarConsultaResponse);
  rpc ListConsultasByPaciente(ListConsultasByPacienteRequest) returns (ListConsultasByPacienteResponse);
  rpc ListUpcomingConsultas(ListUpcomingConsultasRequest) returns (ListUpcomingConsultasResponse);
}
